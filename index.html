<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Штаб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form class="box" id="loginForm" novalidate>
    <div class="brand">Штаб<small>стратегический офис</small></div>
    <div class="authtabs" role="tablist">
      <button type="button" class="authtab on" data-mode="in">Вход</button>
      <button type="button" class="authtab" data-mode="up">Регистрация</button>
    </div>
    <div class="authfld" data-for="name"><label for="name" class="sub">Имя</label>
      <input id="name" type="text" autocomplete="name" placeholder="Как к вам обращаться"></div>
    <div class="authfld" data-for="email"><label for="email" class="sub">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@company.ru"></div>
    <div class="authfld" data-for="password"><label for="password" class="sub">Пароль</label>
      <input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="Не короче 8 символов"></div>
    <div class="authfld" data-for="password2"><label for="password2" class="sub">Пароль ещё раз</label>
      <input id="password2" type="password" autocomplete="new-password" minlength="8"></div>
    <button class="btn primary" type="submit" id="authSubmit">Войти</button>
    <button type="button" class="linkbtn" id="forgotBtn">Забыли пароль?</button>
    <div id="loginMsg" class="sub" role="status"></div>
  </form>
</div>
<div id="shell" hidden>
<div class="app">
  <nav class="side" aria-label="Разделы">
    <div class="brand">Штаб<small>стратегический офис</small></div>
    <div class="navlist" id="nav"></div>
    <div class="foot" id="dbstatus">Подключаю базу…</div>
  </nav>
  <main id="main"></main>
</div>
<button class="fab" type="button" data-act="addTask" aria-label="Новая задача">+ Задача</button>
<div id="modalroot"></div>

</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
